[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ai-code-reviewer"
version = "1.0.0"
requires-python = ">=3.11"
description = "Production-grade AI Code Reviewer & Security Auditing Agent"

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "W", "F", "B", "S", "C", "N"]
ignore = [
    "S101",   # assert allowed in tests
    "S603",   # subprocess without shell (we use it explicitly)
    "B008",   # FastAPI Depends() in function arguments
]
exclude = ["tests/", ".venv/", "migrations/"]

[tool.ruff.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short -v"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.coverage.run]
source = ["api", "agents", "sandbox"]
omit = ["tests/*", "dashboard/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
